name: Build APK (debug)

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Gói 'tools' đã lỗi thời, sdkmanager không còn tìm thấy -> chỉ cài
          # những gói thật sự cần cho compileSdk 36.
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify APK
        working-directory: android-app
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apkanalyzer manifest application-id app/build/outputs/apk/debug/app-debug.apk || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lip-sync-studio-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
